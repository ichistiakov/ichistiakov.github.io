# ============================================================
# Конфиг блога. Минимум, который нужно поменять под себя:
#   baseURL, title, [params] author/tagline/description
# ============================================================

baseURL = "https://ichistiakov.github.io/"   # со слэшем на конце
locale = "ru-RU"
defaultContentLanguage = "ru"
title = "Юрий Чистяков"            # заголовок сайта и логотип в шапке
hasCJKLanguage = false
enableEmoji = true
timeZone = "Europe/Moscow"

# Активная тема. Варианты: meridian · manuscript · signal · midnight
# Переключение = правка этой строки. Быстрый предпросмотр без правки:
#   hugo server --theme manuscript
theme = "meridian"
enableRobotsTXT = true

[params]
  shelfRows = 5                    # минимум полок в книжном шкафу на главной
  author = "Юрий Чистяков"         # подпись автора в постах и schema.org
  tagline = "Пишу о своём пути в мире продуктивности и задач — честно, как есть."
  description = "Личный блог Юрия Чистякова. Главная страница — книжный шкаф: каждая статья — книга на полке."
  heroImage = "img/hero.jpg"       # портрет для страницы «Кто я» (лежит в assets/img/)

[menus]
  [[menus.main]]
    name = "Главная"
    pageRef = "/"
    weight = 10

[taxonomies]
  tag = "tags"

[related]
  includeNewer = true
  threshold = 10
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true    # разрешает сырой HTML в markdown (нужно для внешних ссылок с target="_blank")
  [markup.highlight]
    style = "github"

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
