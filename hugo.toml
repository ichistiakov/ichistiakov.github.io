# ============================================================
# Конфиг блога. Минимум, который нужно поменять под себя:
#   baseURL, title, [params] author/tagline/description
# ============================================================

baseURL = "https://example.com/"   # ← замените на свой домен (со слэшем на конце)
locale = "ru-RU"
defaultContentLanguage = "ru"
title = "Мария Ветрова"            # ← ваше имя: заголовок сайта и логотип в шапке
hasCJKLanguage = false
enableEmoji = true
timeZone = "Europe/Moscow"

# Активная тема. Варианты: meridian · manuscript · signal · midnight
# Переключение = правка этой строки. Быстрый предпросмотр без правки:
#   hugo server --theme manuscript
theme = "meridian"
enableRobotsTXT = true

[params]
  shelfRows = 5                    # минимум полок в книжном шкафу на главной
  author = "Мария Ветрова"         # ← подпись автора в постах и schema.org
  tagline = "Пишу о технологиях, дизайне и работе с AI-агентами"
  description = "Личный блог: заметки о технологиях, инструментах и осмыслении происходящего."
  heroImage = "img/hero.jpg"       # портрет для страницы «Кто я» (лежит в assets/img/)

[menus]
  [[menus.main]]
    name = "Главная"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Кто я"
    pageRef = "/kto-ya"
    weight = 20
  [[menus.main]]
    name = "Блог"
    pageRef = "/blog"
    weight = 30
  [[menus.main]]
    name = "Проекты"
    pageRef = "/proekty"
    weight = 40
  [[menus.main]]
    name = "Now"
    pageRef = "/now"
    weight = 50
  [[menus.main]]
    name = "Библиотека"
    pageRef = "/biblioteka"
    weight = 60
  [[menus.main]]
    name = "Контакты"
    pageRef = "/kontakty"
    weight = 70

[taxonomies]
  tag = "tags"

[related]
  includeNewer = true
  threshold = 10
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true    # разрешает сырой HTML в markdown (нужно для внешних ссылок с target="_blank")
  [markup.highlight]
    style = "github"

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
