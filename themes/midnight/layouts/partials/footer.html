{{- $l := hugo.Data.site.links -}}
{{- $f := hugo.Data.site.footer -}}
<footer class="site-footer">
  <p class="site-footer__name"><span class="mono-tag">// </span>{{ or $f.name site.Title }}</p>
  {{- with $f.about }}<p class="site-footer__about">{{ . }}</p>{{ end }}
  <nav class="site-footer__links" aria-label="Подвал">
    {{- with $l.telegram }}<a href="{{ . }}" target="_blank" rel="noopener">Телеграм</a>
    <span class="dot" aria-hidden="true">·</span>{{ end }}
    {{- with $l.github }}<a href="{{ . }}" target="_blank" rel="noopener">Гитхаб</a>
    <span class="dot" aria-hidden="true">·</span>{{ end }}
    {{- with $l.email }}<a href="mailto:{{ replace . "@" "&#64;" | safeHTML }}">{{ replace . "@" "&#64;" | safeHTML }}</a>
    <span class="dot" aria-hidden="true">·</span>{{ end }}
    <a href="{{ "index.xml" | absURL }}">RSS</a>
  </nav>
</footer>
