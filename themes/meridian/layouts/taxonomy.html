{{ define "main" }}
<article class="page-narrow">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="term-list">
    {{- range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="term-count">{{ len .Pages }}</span></li>
    {{- end }}
  </ul>
</article>
{{ end }}
